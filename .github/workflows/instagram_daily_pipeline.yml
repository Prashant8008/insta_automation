name: Daily Instagram Post Pipeline

on:
  schedule:
    # Morning Run: Daily at 03:30 UTC (9:00 AM IST) - standard daily batch
    - cron: '30 3 * * *'
    # Evening Run: Daily at 13:30 UTC (7:00 PM IST) - checks for new/breaking news only
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      require_new:
        description: 'Check for new news only (shut down if nothing new)'
        type: boolean
        default: false
      immediate:
        description: 'Post to Instagram immediately (skip 1-hour delay)'
        type: boolean
        default: false
      generate_only:
        description: 'Generate & Slack preview only (skip Instagram publishing)'
        type: boolean
        default: false

concurrency:
  group: instagram-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies and Chrome
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Execute Instagram Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || secrets.DRY_RUN || 'false' }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event.inputs.generate_only }}" = "true" ]; then
            echo "Running generation + Slack preview only..."
            python run_instagram_pipeline.py --generate
          elif [ "${{ github.event.inputs.require_new }}" = "true" ] || [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "Running Evening Check: checking for fresh/breaking news since earlier run..."
            python run_instagram_pipeline.py --require-new
          elif [ "${{ github.event.inputs.immediate }}" = "true" ]; then
            echo "Running pipeline with immediate Instagram publishing..."
            python run_instagram_pipeline.py --immediate
          else
            echo "Running standard daily pipeline..."
            python run_instagram_pipeline.py
          fi

      - name: Commit and push updated run logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-card-log.json ssb-topic-log.json ai_news_data.json pending_on_demand.json web_search_result.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(logs): update run logs and topic history [skip ci]"
            git push
          else
            echo "No log changes to commit."
          fi
