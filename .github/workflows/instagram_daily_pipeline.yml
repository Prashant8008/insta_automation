name: Daily Instagram Post Pipeline

on:
  schedule:
    # Morning Run: Daily at 02:00 UTC (7:30 AM IST) - standard daily batch
    - cron: '0 2 * * *'
    # Evening Run: Daily at 13:00 UTC (6:30 PM IST) - checks for breaking news / evening batch
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      require_new:
        description: 'Check for new news only (shut down cleanly if nothing new)'
        type: boolean
        default: false
      immediate:
        description: 'Post to Instagram immediately (5-min interval)'
        type: boolean
        default: true
      generate_only:
        description: 'Generate Reels and Cards only (skip Instagram publishing)'
        type: boolean
        default: false

concurrency:
  group: instagram-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies and Chrome
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Execute Instagram Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REEL_VOICE: ${{ secrets.REEL_VOICE || 'en-IN-NeerjaExpressiveNeural' }}
          DRY_RUN: ${{ vars.DRY_RUN || secrets.DRY_RUN || 'false' }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event.inputs.generate_only }}" = "true" ]; then
            echo "Running generation only..."
            python run_instagram_pipeline.py --generate
          elif [ "${{ github.event.inputs.require_new }}" = "true" ]; then
            echo "Running check: checking for fresh/breaking news since earlier run..."
            python run_instagram_pipeline.py --require-new --immediate
          else
            echo "Running standard daily pipeline (immediate 5-min interval)..."
            python run_instagram_pipeline.py --immediate
          fi

      - name: Commit and push updated run logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-card-log.json ssb-topic-log.json ai_news_data.json web_search_result.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(logs): update run logs and topic history [skip ci]"
            git push
          else
            echo "No log changes to commit."
          fi

