name: Daily Instagram Posting Pipeline

on:
  schedule:
    # Run every day at 15:30 UTC (9:00 PM IST)
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Web UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from GitHub Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}" >> .env
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" >> .env
          echo "SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}" >> .env
          echo "DRY_RUN=false" >> .env
          echo "INSTAGRAM_DELAY_MINUTES=40" >> .env

      - name: Run Daily Posting Pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python run_instagram_pipeline.py
